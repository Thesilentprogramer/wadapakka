[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wadapakka"
version = "0.4.0"
description = "Reliability layer between STT and TTS for Hinglish promise-to-pay calls: read-back, explicit yes, guarded ledger, handoffs, memory between calls."
readme = "docs/SDK.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "websockets>=12",
  "python-multipart>=0.0.9",
  "certifi",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.30"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://wadapakka.vercel.app"
Source = "https://github.com/Thesilentprogramer/wadapakka"

[tool.setuptools]
# The SDK reuses the exact engine modules the hosted demo runs (no forked rules).
py-modules = ["app", "audit", "gnani_stt", "gnani_tts", "handoff", "idempotency", "normalizer",
              "observability", "promise_guard", "slots", "state_machine", "streaming", "verifier"]
packages = ["wadapakka", "wadapakka.adapters"]
